<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 256px;
    height: 256px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .icon-card {
    width: 240px;
    height: 240px;
    border-radius: 56px;
    background: radial-gradient(circle at 30% 20%, #2e266d 0%, #111429 70%, #080a14 100%);
    border: 3px solid rgba(129, 140, 248, 0.4);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 2px 6px rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .glow-ring {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, transparent 70%);
  }
  .hook-svg {
    width: 110px;
    height: 110px;
    color: #ffffff;
    filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.6));
    z-index: 2;
  }
  .accent-dot {
    position: absolute;
    top: 48px;
    right: 48px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 16px #10b981, inset 0 1px 3px rgba(255, 255, 255, 0.6);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="icon-card">
    <div class="glow-ring"></div>
    <div class="accent-dot"></div>
    <svg class="hook-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
    </svg>
  </div>
</body>
</html>
